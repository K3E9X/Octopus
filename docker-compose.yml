# Octopus Leak — the whole product in one command.
#
#   docker compose up --build                 # the app, unmetered, no accounts
#   POSTGRES_URL=postgres://octopus:octopus@db:5432/octopus \
#     docker compose --profile db up --build  # + Postgres: accounts, credits, audit trail
#
# Then open http://localhost:3000
#
# The app detects what is available and says so rather than pretending. Without a
# database there are no accounts, so there is no metering and no audit trail — which is
# fine for a single operator and NOT fine for anything exposed publicly. Without a
# LeakOSINT token there is no leak data, and the app says that too instead of returning
# a clean report nobody should trust.

services:
  app:
    build: .
    image: octopus-leak:local
    ports:
      - "3000:3000"
    environment:
      # the one credential the product needs
      LEAKOSINT_TOKEN: "${LEAKOSINT_TOKEN:-}"
      LEAKOSINT_LIMIT: "${LEAKOSINT_LIMIT:-}"
      # Accounts, credits and the audit trail. NO DEFAULT on purpose: a default applies
      # even without --profile db, so `docker compose up` — the line this file opens
      # with, documented as "unmetered, no accounts" — started with authentication,
      # metering and logging all switched on, pointing at a `db` host that was never
      # started. Every search then demanded a sign-in that could not be completed.
      # With the db profile, set POSTGRES_URL in your .env or on the command line.
      POSTGRES_URL: "${POSTGRES_URL:-}"
      OCTOPUS_SESSION_SECRET: "${OCTOPUS_SESSION_SECRET:-}"
      # the resale margin over the raw API cost
      OCTOPUS_MARKUP: "${OCTOPUS_MARKUP:-}"
    restart: unless-stopped

  # Accounts, credits and the tamper-evident query log all live here. Enable with:
  #   docker compose --profile db up
  db:
    profiles: ["db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: octopus
      POSTGRES_PASSWORD: octopus
      POSTGRES_DB: octopus
    ports:
      - "5432:5432"
    volumes:
      - octopus_pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  octopus_pg:
